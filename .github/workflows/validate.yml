name: Validate research base

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install carrier dependencies
        run: npm ci
      - name: Verify owner boundary, content exports and icon compatibility
        run: npm run test:carrier
      - name: Build private reader and worker
        run: npm run build
      - name: Install isolated browser for reader interaction checks
        run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: .local/playwright-browsers
      - name: Verify reader interactions and multi-page draft recovery
        run: npm run test:browser
        env:
          PLAYWRIGHT_BROWSERS_PATH: .local/playwright-browsers
      - name: Verify installed release upgrades with the actual service worker
        run: npm run test:upgrade
        env:
          PLAYWRIGHT_BROWSERS_PATH: .local/playwright-browsers
      - name: Validate committed catalogues and references
        run: python -m second_algorithm validate
      - name: Verify collectors and recovery without network
        run: python -m unittest discover -s tests -v
      - name: Check C++ references against independent results
        run: |
          mkdir -p .local/ci
          for source in tests/cpp/*_test.cpp; do
            output=".local/ci/$(basename "$source" .cpp)"
            g++ -std=c++17 -pthread -O2 -Wall -Wextra -Wpedantic -D_GLIBCXX_ASSERTIONS "$source" -o "$output"
            timeout 30s "$output"
          done
      - name: Instantiate newer C++ language and range branches
        run: |
          for standard in c++20 c++23; do
            for source in tests/cpp/cpp_generic_test.cpp tests/cpp/cpp_library_ranges_test.cpp tests/cpp/cpp_ring_exception_test.cpp; do
              output=".local/ci/$(basename "$source" .cpp)-$standard"
              g++ -std="$standard" -pthread -O2 -Wall -Wextra -Wpedantic -D_GLIBCXX_ASSERTIONS "$source" -o "$output"
              timeout 30s "$output"
            done
          done
      - name: Verify first C++ chapter copy and ownership compile contracts
        run: python tests/cpp/verify_object_interfaces.py --compiler g++ --output .local/ci/object-interfaces-probes
      - name: Verify separate translation units and call_once retry
        run: python tools/verify_cpp_systems.py --once-retry --output .local/ci/translation
