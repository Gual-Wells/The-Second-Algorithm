name: Verify and publish current practice course

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      research_job:
        description: Existing research job to verify and prepare
        type: string
        required: false
      publish:
        description: Deploy the verified prepared job to production
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: practice-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CXX: g++
      PYTHONDONTWRITEBYTECODE: '1'
      PLAYWRIGHT_BROWSERS_PATH: .local/playwright-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build and verify actual registered content, reader and service worker
        run: npm run check
      - name: Verify and prepare the requested research job
        if: github.event_name == 'workflow_dispatch' && inputs.research_job != ''
        env:
          RESEARCH_JOB: ${{ inputs.research_job }}
        run: |
          python -m second_algorithm research status "$RESEARCH_JOB"
          python -m second_algorithm research verify "$RESEARCH_JOB" --compiler g++
          python -m second_algorithm research prepare-release "$RESEARCH_JOB"
      - name: Publish prepared current inputs
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        env:
          RESEARCH_JOB: ${{ inputs.research_job }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$RESEARCH_JOB" && test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          PACKET=$(python -c 'import json,os;from pathlib import Path;print(json.loads((Path("work/jobs")/os.environ["RESEARCH_JOB"]/"job.json").read_text())["lastPreparedRelease"]["path"])')
          npm run deploy -- --release "$PACKET"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: practice-verification-${{ github.sha }}
          path: |
            .local/course-verification/
            .local/chapter-quality.json
            .local/refinement-qa/results.json
            .local/carrier-upgrade-qa/results.json
            work/jobs/
            .local/releases/*/carrier-build.json
          if-no-files-found: ignore
          retention-days: 14
