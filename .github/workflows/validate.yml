name: Validate research base

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate committed catalogues and references
        run: python -m second_algorithm validate
      - name: Verify collectors and recovery without network
        run: python -m unittest discover -s tests -v
      - name: Check existing C++ template behavior
        run: |
          mkdir -p .local/ci
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -D_GLIBCXX_ASSERTIONS tests/cpp/binary_templates_test.cpp -o .local/ci/binary-test
          .local/ci/binary-test
