name: Validate research base

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate committed catalogues and references
        run: python -m second_algorithm validate
      - name: Verify collectors and recovery without network
        run: python -m unittest discover -s tests -v
      - name: Check C++ references against independent results
        run: |
          mkdir -p .local/ci
          for source in tests/cpp/*_test.cpp; do
            output=".local/ci/$(basename "$source" .cpp)"
            g++ -std=c++17 -pthread -O2 -Wall -Wextra -Wpedantic -D_GLIBCXX_ASSERTIONS "$source" -o "$output"
            timeout 30s "$output"
          done
      - name: Instantiate newer C++ language and range branches
        run: |
          for standard in c++20 c++23; do
            for source in tests/cpp/cpp_generic_test.cpp tests/cpp/cpp_library_ranges_test.cpp tests/cpp/cpp_ring_exception_test.cpp; do
              output=".local/ci/$(basename "$source" .cpp)-$standard"
              g++ -std="$standard" -pthread -O2 -Wall -Wextra -Wpedantic -D_GLIBCXX_ASSERTIONS "$source" -o "$output"
              timeout 30s "$output"
            done
          done
      - name: Verify separate translation units and call_once retry
        run: python tools/verify_cpp_systems.py --once-retry --output .local/ci/translation
