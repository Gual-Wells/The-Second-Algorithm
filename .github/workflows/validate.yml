name: Validate research base

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate committed catalogues and references
        run: python -m second_algorithm validate
      - name: Verify collectors and recovery without network
        run: python -m unittest discover -s tests -v
      - name: Check C++ references against independent results
        run: |
          mkdir -p .local/ci
          for source in tests/cpp/*_test.cpp; do
            output=".local/ci/$(basename "$source" .cpp)"
            g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -D_GLIBCXX_ASSERTIONS "$source" -o "$output"
            "$output"
          done
