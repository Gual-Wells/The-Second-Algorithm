<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#174b84"><meta name="color-scheme" content="light"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="第二算法"><meta name="format-detection" content="telephone=no">
<title>第二算法</title><link rel="manifest" href="/manifest.webmanifest?v=__BUILD__">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-series1.png?v=__BUILD__"><link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="stylesheet" href="/styles.css?v=__BUILD__"><script type="module" src="/app.js?v=__BUILD__"></script></head><body>
<main id="app" class="app-shell app-frame login-mode">
  <header id="appHeader" class="app-header">
    <div class="title-row"><div class="app-title"><p id="headerMeta" class="header-meta">算法实战 · 正在连接</p><h1>第二算法 <small>SECOND ALGORITHM</small></h1></div><div class="header-logo" id="headerLogo" aria-hidden="true">
      <svg viewBox="0 0 512 512" focusable="false"><defs><mask id="algorithm-header-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
        <g id="algorithm-header-shape" transform="translate(256 251.5) scale(0.8871951219512195) translate(-256 -252)">
          <g fill="#fff"><rect x="184" y="88" width="144" height="120" rx="14"/><rect x="72" y="296" width="144" height="120" rx="14"/><rect x="296" y="296" width="144" height="120" rx="14"/></g>
          <path fill="none" stroke="#fff" stroke-width="24" stroke-linecap="round" d="M256 208V248M144 248H368M144 248V296M368 248V296"/>
          <g fill="none" stroke="#000" stroke-width="13" stroke-linecap="round"><path d="M224 148H288"/><path d="M112 356H176"/><path d="M336 356H400"/></g>
        </g>
      </mask></defs><g class="header-logo-ink" mask="url(#algorithm-header-cut)"><rect class="header-logo-base" width="512" height="512" fill="#cfe8ff"/><rect class="header-logo-reflection" width="512" height="512" fill="#fff"/></g></svg>
    </div></div>
    <div class="header-actions" id="headerActions" hidden>
      <button id="previousMajor" class="header-button" data-nav="previous-major" type="button" disabled>上一节</button>
      <button id="nextMajor" class="header-button" data-nav="next-major" type="button" disabled>下一节</button>
      <button id="questionsButton" class="header-button" type="button" disabled>章节答疑<span id="questionsDot" class="unread-dot" hidden></span></button>
      <button id="settingsButton" class="header-button" type="button">设置</button>
    </div>
  </header>
  <section id="chapterNav" class="chapter-nav" aria-label="章节日期" hidden>
    <div class="chapter-nav-row"><button id="previousChapter" class="bevel-button nav-arrow" type="button" aria-label="上一章" disabled>‹</button><button id="chapterJump" class="chapter-jump" data-show-library type="button" aria-label="打开章节册与日历" aria-haspopup="dialog"><strong id="currentDateLabel">今日章节</strong><span id="chapterNavSubtitle">按日期阅读已发布章节</span></button><button id="nextChapter" class="bevel-button nav-arrow" type="button" aria-label="下一章" disabled>›</button></div>
    <div id="dayStrip" class="day-strip" aria-label="本周已发布章节"></div>
  </section>
  <section id="loginView" class="login-view">
    <div class="state-card login-card" data-state="loading"><div class="state-band"><span>第二算法</span><small>SECOND ALGORITHM</small></div><div class="state-body">
      <img class="state-icon login-icon" src="/icons/icon.svg" width="56" height="56" alt=""><h2 id="startupTitle">正在打开章节</h2><p id="startupDescription">正在检查登录状态与已发布章节。</p><p id="loginMessage" class="state-message" role="status"></p>
      <form id="enrollForm" hidden><label class="field-label" for="setupKey">初始化密钥</label><input class="text-input" id="setupKey" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="输入初始化密钥"><button class="primary-button wide-button" type="submit">创建通行密钥</button></form>
      <button type="button" id="loginButton" class="primary-button wide-button login-primary" hidden>使用通行密钥登录</button><button type="button" id="retryButton" class="primary-button wide-button login-primary" hidden>重新连接</button><button type="button" id="startupInstall" class="bevel-button login-install" data-install-info hidden>如何加入 iPhone 主屏幕</button>
    </div></div>
  </section>
  <section id="readerFrame" class="reader-frame" aria-label="算法章节读书器" hidden>
    <section id="chapterView" class="chapter-view" aria-label="章节首页" hidden></section>
    <section id="readerView" class="reader-view" hidden><div id="readingLayout" class="reading-layout"><div id="readingPane" class="reading-pane reading-scroll" tabindex="0" aria-label="正文"><section id="reader" class="reader">
      <div class="reader-head" id="readerHead"><div class="chapter-label"><span id="readerChapterDate"></span><span class="label-separator">/</span><span id="readerChapterNumber"></span></div><div class="chapter-title-row"><h2 id="readerChapterTitle"></h2></div><p id="readerChapterSubtitle"></p></div>
      <div class="part-heading" id="partHeading"><span id="readerPartNumber"></span><strong id="readerPartTitle"></strong><span id="readerPartSummary"></span></div>
      <div class="article-tools" id="articleTools"><button class="bevel-button" id="sectionIndexButton" type="button" aria-haspopup="dialog">目录索引</button><span id="articleToolsHint">按目录定位本章内容</span></div>
      <article id="article" class="paper article"></article>
    </section></div></div></section>
    <div id="readerStatusbar" class="reader-statusbar" role="status"><span id="statusLamp" class="status-lamp"></span><span id="syncStatus">正在连接章节…</span><span id="readingPosition"></span></div>
  </section>
  <div id="readingNotice" class="reading-notice reader-jump-status" role="status" hidden></div>
</main>
<dialog id="sheetDialog" class="sheet-dialog" aria-labelledby="sheetTitle"><div id="sheetFrame" class="sheet"><div class="sheet-head"><button type="button" id="sheetBack" class="bevel-button settings-back" data-action="sheet-back" hidden>返回</button><div><small id="sheetKicker"></small><h2 id="sheetTitle" tabindex="-1"></h2></div><button type="button" id="sheetClose" class="sheet-close" data-sheet-close aria-label="关闭">×</button></div><div id="sheetBody" class="sheet-body" tabindex="0"></div></div></dialog>
<div id="toast" class="toast" role="status" hidden></div><noscript>请启用JavaScript以使用阅读器。</noscript></body></html>
